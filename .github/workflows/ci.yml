name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. No job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json, and current.
        node: [22, 24]

    steps:
      # Actions are pinned to a commit SHA, not a tag. A tag can be moved;
      # a SHA cannot. Dependabot keeps these current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Proves the package Teams actually consumes can be produced, and that
      # the icons are the right size. Cheap, and it fails loudly if someone
      # edits the manifest template into invalid JSON.
      - name: Build the Teams app package
        env:
          BOT_ID: 11111111-1111-4111-8111-111111111111
          GITLAB_ORIGIN: https://gitlab.com
          DEVELOPER_NAME: CI validation only
          WEBSITE_URL: https://company.internal/support
          PRIVACY_URL: https://company.internal/privacy
          TERMS_URL: https://company.internal/terms
        run: pnpm package:teams

      - name: Build standalone backend and dependency inventory
        run: pnpm package:backend

      - name: Verify isolated backend ZIP
        run: pnpm package:verify

      - name: Compile Azure infrastructure
        if: matrix.node == 22
        run: |
          az bicep install --version v0.47.16
          az bicep build --file deploy/azure/main.bicep --outfile /tmp/main.json

      - name: Retain reviewed backend artifact
        if: matrix.node == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/gitlab-unfurl-backend.zip
            artifacts/backend.cdx.json
            artifacts/SHA256SUMS

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
